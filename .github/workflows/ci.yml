name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  build-and-scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ticket-triage-llm:ci .
      - name: Scan da imagem com Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ticket-triage-llm:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
